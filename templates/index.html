<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Article Library</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', path='favicon-96x96.png') }}" sizes="96x96">
</head>
<body>
    <h1>Welcome to Article Library!</h1>

    <form action="/articles" method="post" class="form-add-article">
        <label for="url">Article URL</label>
        <input
            type="url"
            id="url"
            name="url"
            placeholder="https://example.com/article"
            required
        >
        <button type="submit" class="btn-add">Add an article</button>
    </form>
    {% if message %}
        <p role="status" class="status">{{ message }}</p>
    {% endif %}

    <h2>Saved articles</h2>

    {% if articles %}
        <ul>
            {% for article in articles %}
                <li>
                    <a href="{{ article['url'] }}">
                        {{ article['title'] }}
                    </a>
                    <p>{{ article['url'] }}</p>
                    <form action="/articles/{{ article['id'] }}/delete" method="post" class="form-delete">
                        <button type="submit" class="btn-delete" aria-label="Delete article">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="64" height="64" fill="currentColor" aria-hidden="true">
                                <!--!Font Awesome Free 7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                                <path d="M232.7 69.9L224 96L128 96C110.3 96 96 110.3 96 128C96 145.7 110.3 160 128 160L512 160C529.7 160 544 145.7 544 128C544 110.3 529.7 96 512 96L416 96L407.3 69.9C402.9 56.8 390.7 48 376.9 48L263.1 48C249.3 48 237.1 56.8 232.7 69.9zM512 208L128 208L149.1 531.1C150.7 556.4 171.7 576 197 576L443 576C468.3 576 489.3 556.4 490.9 531.1L512 208z"/>
                            </svg>
                        </button>
                    </form>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No articles yet. Add your first one above.</p>
    {% endif %}
</body>
</html>
